<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:880px;height:550px;overflow:hidden;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;background:#1d212b}
.wall{position:absolute;inset:0;background:
 radial-gradient(620px 360px at 50% -8%, rgba(120,135,165,.38) 0%, rgba(120,135,165,0) 70%),
 linear-gradient(180deg,#434c5e 0%,#2e3543 55%,#1d212b 100%)}
.menubar{position:absolute;top:0;left:0;right:0;height:24px;background:rgba(20,22,30,.55);color:#fff;font-size:11.5px;font-weight:500;display:flex;align-items:center;padding:0 14px;gap:16px;z-index:5}
.menubar b{font-weight:700}.menubar .r{margin-left:auto}
.space{position:absolute;left:0;top:0;width:880px;height:550px}
.win{position:absolute;left:0;top:24px;width:880px;height:526px;background:#1e1e20;overflow:hidden;color:#e8e8ed;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.bar{height:38px;display:flex;align-items:center;padding:0 12px;gap:7px;background:#2a2a2d;border-bottom:1px solid rgba(0,0,0,.5)}
.tl{width:11px;height:11px;border-radius:50%}
/* Erfundener Browser mit Bildersuche */
.nav{display:flex;gap:10px;margin-left:14px;color:#8e8e93;font-size:15px}
.addr{flex:1;margin:0 70px 0 40px;height:24px;border-radius:7px;background:#3a3a3d;display:flex;align-items:center;gap:7px;padding:0 10px;font-size:11.5px;color:#d1d1d6}
.tabs{height:40px;display:flex;align-items:flex-end;gap:22px;padding:0 24px;font-size:12px;color:#8e8e93;border-bottom:1px solid rgba(255,255,255,.08)}
.tabs span{padding-bottom:10px}
.tabs .on{color:#fff;border-bottom:2px solid #0a84ff;padding-bottom:8px}
.grid{position:absolute;left:24px;top:94px;display:grid;grid-template-columns:repeat(4,199px);grid-auto-rows:130px;gap:12px}
.grid div{border-radius:8px;background-size:cover;background-position:center}
/* Erfundene Präsentations-App */
.side{position:absolute;left:0;top:38px;bottom:0;width:118px;background:#252528;border-right:1px solid rgba(0,0,0,.4);padding:14px 14px;display:flex;flex-direction:column;gap:12px}
.th{height:50px;border-radius:3px;background:#fff;position:relative;overflow:hidden}
.th.on{box-shadow:0 0 0 2px #2f6ff5}
.th .t{position:absolute;left:7px;top:7px;width:40px;height:4px;background:#1d1d1f;border-radius:1px}
.th .p{position:absolute;top:18px;width:38px;height:26px;border:1px dashed #c7c7cc;border-radius:2px}
.th .ph{position:absolute;top:18px;width:38px;height:26px;border-radius:2px;background-size:cover;background-position:center;opacity:0}
.stage{position:absolute;left:118px;top:38px;right:0;bottom:0;background:#1a1a1c}
#slide{position:absolute;left:22px;top:52px;width:520px;height:292px;background:#fff;border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.45);color:#1d1d1f}
#slide h2{position:absolute;left:30px;top:24px;font-size:23px;font-weight:700;letter-spacing:-.3px}
#slide .sub{position:absolute;left:30px;top:56px;font-size:12px;color:#6e6e73}
.phx{position:absolute;top:96px;width:210px;height:158px;border:1.5px dashed #c7c7cc;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#8e8e93}
.phx.hot{border-color:#2f6ff5;background:rgba(47,111,245,.08);color:#2f6ff5}
.photo{position:absolute;top:96px;width:210px;height:158px;border-radius:3px;background-size:cover;background-position:center;opacity:0}
/* Ablage */
#shelf{position:absolute;right:0;top:30px;width:374px;height:510px;transform-origin:100% 50%;z-index:3}
#shelf img{position:absolute;inset:0;width:100%;height:100%;opacity:0}
#strip{position:absolute;right:0;width:7px;height:68px;background:#000;border-radius:6px 0 0 6px;top:251px;box-shadow:0 0 0 1px rgba(255,255,255,.2);z-index:2}
#ghost{position:absolute;z-index:6;pointer-events:none}
#pointer{position:absolute;width:20px;height:28px;z-index:8}
#keys{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:6px;z-index:9;opacity:0}
#keys span{min-width:34px;height:34px;padding:0 9px;border-radius:8px;background:rgba(30,30,34,.85);color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .5px rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.35)}
</style></head><body>
