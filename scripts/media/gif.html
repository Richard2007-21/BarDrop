<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:880px;height:550px;overflow:hidden;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.wall{position:absolute;inset:0;background:
 radial-gradient(700px 500px at 15% 110%, #ff8a6b 0%, rgba(255,138,107,0) 55%),
 radial-gradient(600px 450px at 85% -10%, #3a5bff 0%, rgba(58,91,255,0) 60%),
 radial-gradient(520px 520px at 60% 60%, #8a3ffc 0%, rgba(138,63,252,0) 65%),
 linear-gradient(135deg,#1a1f6b 0%,#5b2ca8 45%,#c2477d 80%,#f08a5d 100%)}
.menubar{position:absolute;top:0;left:0;right:0;height:24px;background:rgba(20,10,40,.3);color:#fff;font-size:11.5px;font-weight:500;display:flex;align-items:center;padding:0 14px;gap:16px}
.menubar b{font-weight:700}.menubar .r{margin-left:auto}
.icon{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;width:90px;transform:translate(-50%,-50%)}
.icon .lb{font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:1px 5px;border-radius:4px}
.icon.sel .lb{background:#2f6ff5;text-shadow:none}
.icon.sel .im{outline:3px solid rgba(255,255,255,.28);border-radius:6px;background:rgba(255,255,255,.16)}
.folder{width:62px;height:48px;position:relative}
.folder:before{content:"";position:absolute;left:0;top:0;width:26px;height:10px;background:#4aa3ef;border-radius:4px 4px 0 0}
.folder:after{content:"";position:absolute;left:0;top:5px;right:0;bottom:0;background:linear-gradient(#6cc0ff,#3a96ea);border-radius:4px;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.folder.hot:after{background:linear-gradient(#3d7fd0,#2a68c0)}
#shelf{position:absolute;right:0;top:30px;width:374px;height:510px;transform-origin:100% 50%}
#shelf img{position:absolute;inset:0;width:100%;height:100%}
#strip{position:absolute;right:0;width:7px;height:68px;background:#000;border-radius:6px 0 0 6px;top:251px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
#ghost{position:absolute;transform:translate(-50%,-50%)}
#ghost img{width:54px;height:41px;opacity:.85;display:block}
#pointer{position:absolute;width:20px;height:28px}
</style></head><body>
<div class="wall"></div>
<div class="menubar"><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span><span class="r">9:41</span></div>
<div class="icon" id="folder" style="left:120px;top:110px"><div class="folder im" id="fold"></div><div class="lb">Photos</div></div>
<div class="icon" id="lake" style="left:120px;top:230px"><img class="im" src="lake_icon.png" style="width:54px;height:41px"><div class="lb">Lake.jpg</div></div>
<div id="strip"></div>
<div id="shelf"><img id="s1" src="Produkt_GIF_ohne.png"><img id="s2" src="Produkt_GIF_oben.png"></div>
<div id="ghost"><img src="lake_icon.png"></div>
<svg id="pointer" viewBox="0 0 22 30"><path d="M2 2 L2 24 L8 18.5 L12 27 L15.5 25.5 L11.5 17 L19 17 Z" fill="#000" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
<script>
const E=(t)=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, C=(x)=>Math.max(0,Math.min(1,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function seg(t,a,b){return C((t-a)/(b-a))}
function path(t,keys){ // keys [[time,x,y]]
  if(t<=keys[0][0])return keys[0].slice(1);
  for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const[a,x0,y0]=keys[i-1],[b,x1,y1]=keys[i];const u=E(C((t-a)/(b-a)));return[lerp(x0,x1,u),lerp(y0,y1,u)]}}
  return keys[keys.length-1].slice(1)}
const LAKE=[120,230], SLOT=[672,198], EDGE=[862,288], FOLD=[120,110];
const P=[[0,330,420],[0.4,330,420],[1.0,LAKE[0]+6,LAKE[1]+4],[1.25,LAKE[0]+6,LAKE[1]+4],[2.45,EDGE[0],EDGE[1]],[2.75,EDGE[0],EDGE[1]],[3.6,560,400],[4.1,560,400],[4.7,866,300],[5.05,866,300],[5.45,SLOT[0]+8,SLOT[1]+6],[5.6,SLOT[0]+8,SLOT[1]+6],[6.9,FOLD[0]+8,FOLD[1]+6],[7.15,FOLD[0]+8,FOLD[1]+6],[8.2,330,420],[8.8,330,420]];
window.render=function(t){
  const [px,py]=path(t,P); const pt=document.getElementById('pointer'); pt.style.left=px+'px'; pt.style.top=py+'px';
  // selection on desktop
  document.getElementById('lake').classList.toggle('sel', t>1.05&&t<2.6);
  // ghost
  const g=document.getElementById('ghost'); let gs=0, gx=px-6, gy=py-4, gsc=1;
  if(t>1.25&&t<2.5){gs=1}
  if(t>=2.5&&t<2.75){gs=1-seg(t,2.6,2.75); const u=E(seg(t,2.5,2.72)); gx=lerp(EDGE[0]-6,SLOT[0],u); gy=lerp(EDGE[1]-4,SLOT[1],u); gsc=lerp(1,1.15,u)}
  if(t>5.6&&t<6.95){gs=1}
  if(t>=6.95&&t<7.15){const u=seg(t,6.95,7.12); gs=1-u; gsc=1-.6*u; gx=FOLD[0]; gy=FOLD[1]}
  g.style.opacity=gs; g.style.left=gx+'px'; g.style.top=gy+'px'; g.style.transform=`translate(-50%,-50%) scale(${gsc})`;
  // desktop lake: moves into folder at 7.0, comes back at loop seam
  let lo=1; if(t>6.95) lo=1-seg(t,6.95,7.1); if(t>8.0) lo=seg(t,8.0,8.7);
  document.getElementById('lake').style.opacity=lo;
  document.getElementById('fold').classList.toggle('hot', t>6.6&&t<7.05);
  const fs=(t>7.0&&t<7.3)?1+.08*Math.sin(seg(t,7.0,7.3)*Math.PI):1; document.getElementById('folder').style.transform=`translate(-50%,-50%) scale(${fs})`;
  // shelf open state
  let open=0;
  if(t>=2.15&&t<3.15) open=E(seg(t,2.15,2.45)); if(t>=3.15&&t<3.45) open=1-E(seg(t,3.15,3.4));
  if(t>=4.75&&t<6.05) open=E(seg(t,4.75,5.05)); if(t>=6.05&&t<6.4) open=1-E(seg(t,6.05,6.35));
  const sh=document.getElementById('shelf'); sh.style.opacity=C(open*1.6); sh.style.transform=`scale(${lerp(.55,1,open)},${lerp(.35,1,open)})`;
  document.getElementById('s2').style.opacity=(t>2.62&&t<6.2)?1:0;
  // strip
  let st=0; if(t>1.85&&t<3.7) st=seg(t,1.85,2.0)*(1-seg(t,3.45,3.7)); if(t>4.4&&t<6.6) st=seg(t,4.4,4.55)*(1-seg(t,6.35,6.6));
  const s=document.getElementById('strip'); s.style.opacity=st; s.style.width=(7*st)+'px';
}
render(0);
</script></body></html>
