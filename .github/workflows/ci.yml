name: CI

# Bauen und testen für Zweige mit Korrekturen. Veröffentlicht nichts;
# Releases macht weiterhin release.yml.
on:
  push:
    branches: [review/beta5-fixes]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Bauen
        run: swift build

      - name: Tests
        run: swift test

      - name: Tests mit Thread Sanitizer
        run: swift test --sanitize=thread
