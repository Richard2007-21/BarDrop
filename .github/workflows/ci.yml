name: CI

# Bauen und testen für Zweige mit Korrekturen. Veröffentlicht nichts;
# Releases macht weiterhin release.yml.
on:
  push:
    branches: ['review/**']
  workflow_dispatch:

permissions:
  # write nur für die Vorschaubilder am Entwurf „ci-previews“ (siehe unten)
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Die Schritte laufen mit „bash -e -o pipefail“: Ein grep ohne Treffer darf den
      # Schritt nicht beenden, deshalb „|| true“ hinter den Auswertungen.
      # Ergebnisse auch als Annotationen: Sie sind in der Übersicht des Laufs und über
      # die API lesbar, ohne das ganze Protokoll zu laden.
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          echo "::notice title=Toolchain::macOS $(sw_vers -productVersion), $(xcodebuild -version | head -1), $(swift --version 2>&1 | head -1)"

      - name: Bauen
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log || {
            grep -E "error:" build.log | sort -u | head -20 | while IFS= read -r line; do echo "::error title=Build::${line}"; done || true
            exit 1
          }
          echo "::notice title=Build::$(grep -c 'warning:' build.log || true) Warnungen"
          # Wortlaut der Warnungen (ohne Dubletten), damit neue auffallen
          grep "warning:" build.log | sed -E 's#^.*/(Sources|Tests)/#\1/#' | sort | uniq -c | sort -rn | head -10 | while IFS= read -r line; do echo "::notice title=Warnung::${line}"; done || true

      - name: Tests
        env:
          BARDROP_PREVIEW_DIR: ${{ runner.temp }}/previews
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || STATUS=$?
          grep -E "error:|' failed \(" test.log | sort -u | head -20 | while IFS= read -r line; do echo "::error title=Test::${line}"; done || true
          grep -E "Executed [0-9]+ tests" test.log | tail -1 | while IFS= read -r line; do echo "::notice title=Tests::${line}"; done || true
          grep -E "' skipped" test.log | sort -u | head -5 | while IFS= read -r line; do echo "::notice title=Übersprungen::${line}"; done || true
          exit ${STATUS:-0}

      - name: Tests mit Thread Sanitizer
        run: |
          set -o pipefail
          swift test --sanitize=thread 2>&1 | tee tsan.log || STATUS=$?
          grep -E "error:|' failed \(" tsan.log | sort -u | head -20 | while IFS= read -r line; do echo "::error title=TSan Test::${line}"; done || true
          RACES=$(grep -c "WARNING: ThreadSanitizer" tsan.log || true)
          echo "::notice title=Thread Sanitizer::${RACES} Warnungen"
          # Ort jeder Warnung: erste Zeile aus eigenem Code danach
          grep -A30 "WARNING: ThreadSanitizer" tsan.log | grep -E "Sources/BarDrop/|Tests/BarDropTests/" | sed -E 's/.*(Sources|Tests)\//\1\//' | sort | uniq -c | sort -rn | head -10 | while IFS= read -r line; do echo "::warning title=TSan Ort::${line}"; done || true
          grep -E "Executed [0-9]+ tests" tsan.log | tail -1 | while IFS= read -r line; do echo "::notice title=TSan Tests::${line}"; done || true
          exit ${STATUS:-0}

      # Bilder der Ansichten aus den Tests an einen Release-Entwurf hängen, der nur
      # Mitwirkenden sichtbar ist (Entwürfe erscheinen weder in der App noch öffentlich).
      # So lassen sich die Ansichten ansehen, ohne die App zu starten.
      - name: Vorschaubilder
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ runner.temp }}/previews
        run: |
          [ -d "$DIR" ] || { echo "::notice title=Vorschaubilder::keine erzeugt"; exit 0; }
          cd "$DIR"
          COUNT=$(ls *.png 2>/dev/null | wc -l | tr -d ' ')
          echo "::notice title=Vorschaubilder::${COUNT} Bilder"
          [ "$COUNT" -gt 0 ] || exit 0
          zip -q previews.zip *.png
          # Entwürfe haben kein Tag: über die Liste suchen
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft and .name == "CI Vorschaubilder") | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name=ci-previews -f name="CI Vorschaubilder" \
                 -f body="Automatisch aus ci.yml; kein Release." -F draft=true --jq .id 2>&1) || { echo "::error title=Vorschaubilder::Entwurf: ${ID}"; exit 1; }
          fi
          for OLD in $(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --jq '.[] | select(.name == "previews.zip") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD"
          done
          OUT=$(curl -sS -f -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/zip" \
                --data-binary @previews.zip \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=previews.zip" 2>&1) \
            || { echo "::error title=Vorschaubilder::Hochladen: ${OUT}"; exit 1; }
          echo "::notice title=Vorschaubilder::${COUNT} Bilder für ${GITHUB_SHA::7} am Entwurf ${ID}"
