name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: true

jobs:
  build:
    # macOS 26 mit Xcode 26: Fensterknöpfe, Menüs und Hinweise im aktuellen Stil des Systems
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Texte, Version und Release-Notizen prüfen
        run: python3 scripts/check_project.py

      - name: Tests (Import, Speichern, Stapel, Ansichten)
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || {
            grep -E "error:|failed" test.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::${line#*/Tests/}"
            done
            exit 1
          }
          # Zusammenfassung sichtbar machen (bestanden, übersprungen)
          grep -E "Executed [0-9]+ tests|skipped" test.log | sort -u | tail -8 | while IFS= read -r line; do
            echo "::notice::${line}"
          done

      - name: App und DMG bauen
        run: |
          chmod +x scripts/build_app.sh
          set -o pipefail
          ./scripts/build_app.sh 2>&1 | tee build.log || {
            # Compilerfehler als Annotationen ausgeben, damit sie in der Übersicht sichtbar sind
            grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::${line#*/Sources/}"
            done
            exit 1
          }

      - name: Starttest
        # Die fertige App starten: Sie muss 15 Sekunden laufen, ohne abzustürzen
        run: |
          build/BarDrop.app/Contents/MacOS/BarDrop > launch.log 2>&1 &
          PID=$!
          sleep 15
          if ! kill -0 "$PID" 2>/dev/null; then
            wait "$PID"; CODE=$?
            echo "::error::BarDrop hat sich nach dem Start beendet (Code $CODE)"
            tail -40 launch.log
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i bardrop | head -1 | while read -r report; do
              head -60 ~/Library/Logs/DiagnosticReports/"$report"
            done
            exit 1
          fi
          kill "$PID"
          echo "::notice::BarDrop lief 15 Sekunden ohne Absturz"

      - name: DMG als Build-Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: BarDrop-dmg
          path: build/BarDrop.dmg

      - name: GitHub Release aktualisieren
        # Pull Requests werden nur gebaut und getestet, nicht veröffentlicht
        if: ${{ github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip release]') }}
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ contains(github.event.head_commit.message, '[stable]') }}
        run: |
          VERSION="$(cat Resources/VERSION | tr -d '[:space:]')"
          TAG="v$VERSION"
          # Beta-Kanal: Jede Version erscheint zuerst als Beta (Vorabversion). Erst ein Commit
          # mit [stable] in der Nachricht veröffentlicht sie als reguläre Version.
          if [ "$STABLE" = "true" ]; then
            CHANNEL_FLAGS="--latest"
            PRE="false"
          else
            CHANNEL_FLAGS="--prerelease --latest=false"
            PRE="true"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/BarDrop.dmg --clobber
            gh release edit "$TAG" --notes-file .github/RELEASE_NOTES.md --prerelease="$PRE"
            if [ "$PRE" = "false" ]; then gh release edit "$TAG" --latest; fi
          else
            gh release create "$TAG" build/BarDrop.dmg \
              --title "BarDrop $VERSION" \
              --notes-file .github/RELEASE_NOTES.md \
              --target "$GITHUB_SHA" \
              $CHANNEL_FLAGS
          fi
