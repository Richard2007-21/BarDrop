name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: [fehler]
body:
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was hast du erwartet, was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Bild aus Safari an den rechten Rand ziehen
        2. …
  - type: input
    id: bardrop
    attributes:
      label: BarDrop-Version
      description: Einstellungen → Über BarDrop
      placeholder: "1.12.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS-Version
      placeholder: "macOS 15.2"
    validations:
      required: true
  - type: textarea
    id: protokoll
    attributes:
      label: Protokoll (optional)
      description: In der Konsole-App nach „com.zzuuuiii.bardrop“ filtern und die passenden Zeilen hier einfügen. Bitte vorher persönliche Dateinamen entfernen.
      render: text
